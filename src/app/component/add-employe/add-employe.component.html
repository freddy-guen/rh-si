<form [formGroup]="employeForm" (ngSubmit)="saveEmploye()">
  <mat-card>
    <mat-card-header>
      <h2>{{ titre }}</h2>
    </mat-card-header>

    <mat-card-content>
        <mat-form-field>
          <mat-label>Identifiant</mat-label>
          <input matInput formControlName="id">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Nom</mat-label>
          <input matInput formControlName="nom">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Prénom</mat-label>
          <input matInput formControlName="prenom">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Date de naissance</mat-label>
          <input matInput [matDatepicker]="pickerDateNaissance" formControlName="dateNaissance">
          <mat-datepicker-toggle matIconSuffix [for]="pickerDateNaissance"></mat-datepicker-toggle>
          <mat-datepicker #pickerDateNaissance></mat-datepicker>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Rôle</mat-label>
          <mat-select formControlName="role">
            <mat-option value="">Sélectionner un rôle</mat-option>
            <mat-option value="manager">Manager</mat-option>
            <mat-option value="developpeur">Développeur</mat-option>
            <mat-option value="po">Product owner</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Date d'entrée</mat-label>
          <input matInput [matDatepicker]="pickerDateEntree" formControlName="dateEntree">
          <mat-datepicker-toggle matIconSuffix [for]="pickerDateEntree"></mat-datepicker-toggle>
          <mat-datepicker #pickerDateEntree></mat-datepicker>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Salaire</mat-label>
          <input matInput formControlName="salaire">
        </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button type="submit" mat-raised-button color="primary">Enregistrer</button>
      <a mat-raised-button color="accent" (click)="closePopup()">Annuler</a>
    </mat-card-actions>
  </mat-card>
</form>
